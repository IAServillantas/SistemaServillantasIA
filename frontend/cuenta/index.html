<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta | Servillantas</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; color: #1a2330; }
    main { width: min(24rem, calc(100% - 2rem)); background: #fff; border: 1px solid #d7dee7; border-radius: .75rem; padding: 1.5rem; }
    h1 { margin: 0 0 .25rem; font-size: 1.35rem; }
    p { margin: 0 0 1rem; color: #5b6775; font-size: .95rem; }
    label { display: block; margin: .75rem 0 .35rem; font-size: .85rem; color: #5b6775; }
    input { width: 100%; box-sizing: border-box; padding: .7rem .8rem; border: 1px solid #d7dee7; border-radius: .5rem; font: inherit; }
    button { margin-top: 1rem; width: 100%; padding: .8rem 1rem; border: 0; border-radius: .5rem; background: #1a2330; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #fff; color: #1a2330; border: 1px solid #d7dee7; margin-top: .6rem; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: .9rem; font-size: .9rem; min-height: 1.2em; }
    .msg.error { color: #9b1c1c; }
    .msg.ok { color: #0f7a3a; }
    a { color: #1a2330; }
  </style>
</head>
<body>
  <main>
    <h1>Mi cuenta</h1>
    <p id="userMeta">Verificando sesion...</p>
    <form id="passwordForm">
      <label for="password">Nueva contrasena</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="password2">Confirmar contrasena</label>
      <input id="password2" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submitBtn" type="submit">Guardar contrasena</button>
      <button class="secondary" type="button" id="backBtn">Volver al inicio</button>
      <div id="msg" class="msg" role="status"></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-config.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
