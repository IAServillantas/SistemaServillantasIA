<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion | Servillantas</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #eef2f6, #f7f4ef 55%, #e8eef5); color: #1a2330; }
    main { width: min(24rem, calc(100% - 2rem)); background: #fff; border: 1px solid #d7dee7; border-radius: .75rem; padding: 1.5rem; box-shadow: 0 10px 30px rgba(26,35,48,.06); }
    h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
    p { margin: 0 0 1.25rem; color: #5b6775; font-size: .95rem; }
    label { display: block; margin: .75rem 0 .35rem; font-size: .85rem; color: #5b6775; }
    input { width: 100%; box-sizing: border-box; padding: .7rem .8rem; border: 1px solid #d7dee7; border-radius: .5rem; font: inherit; }
    button { margin-top: 1.1rem; width: 100%; padding: .8rem 1rem; border: 0; border-radius: .5rem; background: #1a2330; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { margin-top: .9rem; color: #9b1c1c; font-size: .9rem; min-height: 1.2em; }
    .hint { margin-top: 1rem; font-size: .8rem; color: #7a8694; }
  </style>
</head>
<body>
  <main>
    <h1>Servillantas</h1>
    <p>Acceso al control de inventario</p>
    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Contrasena</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitBtn" type="submit">Entrar</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <p class="hint">Roles: super administrador, Chihuahua o Juarez.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-config.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
