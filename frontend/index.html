<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servillantas | Inventario</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; color: #1a2330; }
    main { width: min(28rem, calc(100% - 2rem)); }
    .top { display: flex; justify-content: space-between; gap: 1rem; align-items: start; margin-bottom: 1rem; }
    h1 { margin: 0 0 .35rem; font-size: 1.5rem; }
    p { margin: 0; color: #5b6775; }
    a.card { display: block; padding: .9rem 1rem; margin: .5rem 0; background: #fff; border: 1px solid #d7dee7; border-radius: .5rem; color: inherit; text-decoration: none; }
    a.card:hover { border-color: #1a2330; }
    a.card[hidden] { display: none; }
    small { display: block; color: #5b6775; margin-top: .2rem; }
    button { border: 1px solid #d7dee7; background: #fff; border-radius: .45rem; padding: .45rem .7rem; cursor: pointer; font: inherit; }
    .banner { margin: 0 0 1rem; padding: .7rem .8rem; border-radius: .5rem; background: #fff4f0; color: #9b1c1c; border: 1px solid #f0d2c8; }
    .banner[hidden] { display: none; }
    .meta { font-size: .85rem; color: #5b6775; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>Servillantas</h1>
        <p>Control de inventario</p>
      </div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end">
        <button id="accountBtn" type="button">Cuenta</button>
        <button id="logoutBtn" type="button">Salir</button>
      </div>
    </div>
    <p id="denied" class="banner" hidden>No tienes permiso para esa seccion.</p>
    <p id="userMeta" class="meta">Verificando sesion...</p>
    <a id="linkInventario" class="card" href="inventario/" hidden>Inventario general<small>Juarez · SAT · INS · CUE · TOR</small></a>
    <a id="linkChihuahua" class="card" href="chihuahua/" hidden>Chihuahua<small>PLT · CVT · proveedores</small></a>
    <a id="linkCriticas" class="card" href="criticas/" hidden>Criticas sin existencia<small>Vista prioritaria Juarez</small></a>
    <a id="linkAdmin" class="card" href="admin/" hidden>Admin usuarios<small>Resetear contrasenas</small></a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/supabase-config.js"></script>
  <script src="shared/auth.js"></script>
  <script>
    (async () => {
      const denied = document.getElementById('denied');
      if (new URLSearchParams(location.search).get('denied')) denied.hidden = false;
      const auth = await Auth.requireAuth({ page: '/' });
      if (!auth) return;
      const { profile } = auth;
      document.getElementById('userMeta').textContent = `${profile.full_name || profile.email} · ${profile.role}`;
      document.getElementById('linkInventario').hidden = !Auth.canOpen(profile.role, '/inventario/');
      document.getElementById('linkChihuahua').hidden = !Auth.canOpen(profile.role, '/chihuahua/');
      document.getElementById('linkCriticas').hidden = !Auth.canOpen(profile.role, '/criticas/');
      document.getElementById('linkAdmin').hidden = profile.role !== 'super_admin';
      document.getElementById('accountBtn').onclick = () => { location.href = '/cuenta/'; };
      document.getElementById('logoutBtn').onclick = () => Auth.signOut();
    })();
  </script>
</body>
</html>
